# Deploys Sneha's Vite portfolio to GitHub Pages (project site).
# Result: https://snasa045.github.io/portfolios/
# Requires: repo Settings -> Pages -> Source = "GitHub Actions".
# Note: on a free GitHub plan the repo must be public for Pages.
name: Deploy Sneha portfolio to Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/sneha-portfolio/**'
      - '.github/workflows/deploy-sneha.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=sneha-portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/sneha-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
