# Deploys Sneha's Vite portfolio to GitHub Pages (project site).
# Result: https://snasa045.github.io/portfolios/sneha/
# (Root /portfolios/ redirects there; leaves room for /portfolios/sid/ later.)
# Requires: repo Settings -> Pages -> Source = "GitHub Actions".
name: Deploy Sneha portfolio to Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/sneha-portfolio/**'
      - '.github/workflows/deploy-sneha.yml'
      # Dependency changes affect the build even when the app folder is untouched.
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=sneha-portfolio
      - name: Stage Pages artifact under sneha/ subpath
        run: |
          mkdir -p pages/sneha
          cp -r apps/sneha-portfolio/dist/* pages/sneha/
          # Pages serves the site-root 404.html for any unmatched path, including
          # /portfolios/sneha/* — its asset links are absolute, so they still resolve.
          cp apps/sneha-portfolio/dist/404.html pages/404.html
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./sneha/"><link rel="canonical" href="./sneha/"></head><body><p>Redirecting to <a href="./sneha/">Sneha&rsquo;s portfolio</a>&hellip;</p></body></html>' > pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
